services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ldf-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-Password123!}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Password123!}' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ldf-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=LdfProductionDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123!};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-LdfDevelopmentOnlySecretKeyForLocalTesting2026_AtLeast32Chars}
      - Jwt__Issuer=LdfIssuer
      - Jwt__Audience=LdfAudience
      - APPLY_MIGRATIONS=true
    ports:
      - "5205:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ldf-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
